trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"
    displayName: Use Python 3.11

  - script: python -m pip install --upgrade uv
    displayName: Install uv

  - task: Cache@2
    inputs:
      key: 'uv | "$(Agent.OS)" | uv.lock'
      restoreKeys: |
        uv | "$(Agent.OS)"
      path: $(UV_CACHE_DIR)
    displayName: Cache uv downloads

  - script: uv sync --frozen
    displayName: Restore locked dependencies

  - script: uv run --python 3.11 python -m compileall sdbench
    displayName: Compile package

  - script: uv build
    displayName: Build distributions
